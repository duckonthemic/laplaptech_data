services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.33.6
    container_name: laplap-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${LOCAL_CH_USERNAME:-default}
      CLICKHOUSE_PASSWORD: ${LOCAL_CH_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/ddl:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -qx 'Ok.'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  clickhouse_data:
